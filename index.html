<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tip Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>AI Tip Advisor</h1>
        <p>Get AI-powered suggestions on how much to tip projects based on their quality, community love, and creator reputation.</p>
        <div class="filter-controls">
            <div class="filter-group">
                <label for="range-filter">Time Range:</label>
                <select id="range-filter">
                    <option value="all">All Time</option>
                    <option value="week" selected>This Week</option>
                    <option value="month">This Month</option>
                    <option value="day">Today</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="feed-filter">Sort By:</label>
                <select id="feed-filter">
                    <option value="hot" selected>Hot</option>
                    <option value="new">New</option>
                    <option value="top">Top</option>
                    <option value="engaging">Most Engaging</option>
                    <option value="viral">Viral</option>
                    <option value="most_tipped">Most Tipped</option>
                </select>
            </div>
            
            <label class="toggle-container">
                <input type="checkbox" id="multiplayer-only">
                <span class="toggle-slider"></span>
                Multiplayer Only
            </label>
            
            <label class="toggle-container">
                <input type="checkbox" id="hide-giveaways" checked>
                <span class="toggle-slider"></span>
                Hide Giveaways & Tip-Asking Sites
            </label>
        </div>
    </header>
    <main id="projects-container"></main>
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p>Analyzing projects with AI...</p>
    </div>

    <script type="importmap">
    {
      "imports": {
        "https://cdn.jsdelivr.net/npm/marked/": "https://cdn.jsdelivr.net/npm/marked/"
      }
    }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
